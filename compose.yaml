# Run with: podman compose up --build -d
#
#   browser -> host :PROXY_PORT (published)
#                 -> proxy :8080 ----+-- /api/* --> api   EDGE_GATEWAY:API_PORT  (host network)
#                    [edge network]  +-- /*     --> web   web:3200               [edge network]
#
# - proxy and web run on the "edge" bridge network. Only the proxy publishes a port.
# - api needs the host's network namespace to ping, probe and read the ARP cache
#   of the LAN. It listens on the edge network's gateway address, which exists only
#   on the host and is reachable from the edge containers but not from the LAN.
# - Requires rootful Podman (default for `podman machine`; on Linux use sudo):
#   with rootless Podman the bridge lives in a separate namespace the api cannot bind to.
name: network-view

networks:
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-10.89.40.0/24}
          gateway: ${EDGE_GATEWAY:-10.89.40.1}

services:
  api:
    build:
      context: .
      dockerfile: deploy/api/Containerfile
    image: localhost/network-view-api:latest
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    environment:
      HOST: ${EDGE_GATEWAY:-10.89.40.1}
      PORT: ${API_PORT:-3100}
    # The edge bridge (and with it the gateway address) exists once a container joins it.
    depends_on:
      web:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://' + process.env.HOST + ':' + process.env.PORT + '/api/network-discovery/interfaces').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/web/Containerfile
    image: localhost/network-view-web:latest
    networks: [edge]
    expose: ["3200"]
    cap_drop: [ALL]
    # The Caddy binary carries this file capability, so it must stay in the bounding set.
    cap_add: [NET_BIND_SERVICE]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3200/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  proxy:
    build:
      context: .
      dockerfile: deploy/proxy/Containerfile
    image: localhost/network-view-proxy:latest
    networks: [edge]
    ports:
      - "${PROXY_BIND:-0.0.0.0}:${PROXY_PORT:-8080}:8080"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    environment:
      API_UPSTREAM: ${EDGE_GATEWAY:-10.89.40.1}:${API_PORT:-3100}
      WEB_UPSTREAM: web:3200
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
